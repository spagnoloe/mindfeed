name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: App tests
        run: pnpm test

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Start local Supabase
        run: supabase start

      - name: Contract tests (fake and Supabase)
        run: pnpm test:contract
